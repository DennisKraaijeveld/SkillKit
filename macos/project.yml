name: SkillKit
options:
  bundleIdPrefix: com.denniskraaijeveld
  xcodeVersion: "26.0"
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
  Performance: release
packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    from: 0.8.0
  MarkdownEngine:
    url: https://github.com/nodes-app/swift-markdown-engine.git
    exactVersion: 0.12.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.4
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SPARKLE_PUBLIC_ED_KEY: ""
  configs:
    Performance:
      ONLY_ACTIVE_ARCH: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_CODE_COVERAGE: NO
      CLANG_ENABLE_CODE_COVERAGE: NO
      SWIFT_ENABLE_CODE_COVERAGE: NO
      ENABLE_ADDRESS_SANITIZER: NO
      ENABLE_THREAD_SANITIZER: NO
      ENABLE_UNDEFINED_BEHAVIOR_SANITIZER: NO
targets:
  Skillbook:
    type: application
    platform: macOS
    info:
      path: Skillbook/Info.plist
      properties:
        CFBundleDisplayName: SkillKit
        CFBundleName: SkillKit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Apache-2.0
        SUFeedURL: https://github.com/DennisKraaijeveld/SkillKit/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
    sources:
      - path: Skillbook
        excludes:
          - "*.entitlements"
      - path: Generated
        includes:
          - "*.swift"
        optional: true
    dependencies:
      - package: Markdown
      - package: MarkdownEngine
      - package: MarkdownEngine
        product: MarkdownEngineCodeBlocks
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: SkillKit
        PRODUCT_MODULE_NAME: Skillbook
        PRODUCT_BUNDLE_IDENTIFIER: com.denniskraaijeveld.skillkit
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Skillbook/Skillbook.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Skillbook/Skillbook-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Generated
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Generated
        OTHER_LDFLAGS: -lskillbook_ffi -lc++ -liconv -lresolv -framework CoreFoundation -framework CoreServices -framework Security -framework SystemConfiguration
    entitlements:
      path: Skillbook/Skillbook.entitlements
    preBuildScripts:
      - name: Build Rust FFI
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          "${SRCROOT}/scripts/build-ffi.sh"
  SkillbookTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SkillbookTests
        excludes:
          - PerformanceTests.swift
    dependencies:
      - target: Skillbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.denniskraaijeveld.skillkit.tests
        HEADER_SEARCH_PATHS: $(SRCROOT)/Generated
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SkillKit.app/Contents/MacOS/SkillKit
        BUNDLE_LOADER: $(TEST_HOST)
  SkillbookPerformanceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SkillbookTests/PerformanceTests.swift
      - path: Skillbook/MarkdownContent.swift
      - path: Skillbook/Models.swift
      - path: Skillbook/SidebarModel.swift
    dependencies:
      - package: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.denniskraaijeveld.skillkit.performance-tests
schemes:
  SkillKit:
    build:
      targets:
        Skillbook: all
        SkillbookTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "--restart-onboarding": true
    test:
      targets:
        - SkillbookTests
  SkillKit Performance:
    build:
      targets:
        Skillbook: [profile]
        SkillbookPerformanceTests: [test]
    test:
      config: Performance
      debugEnabled: false
      gatherCoverageData: false
      targets:
        - SkillbookPerformanceTests
    profile:
      config: Performance
