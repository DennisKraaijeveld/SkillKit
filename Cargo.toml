[workspace]
members = [
    "crates/skillbook-core",
    "crates/skillbook-ffi",
    "crates/skillbook-mcp",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
dirs = "6"
notify = "8.2"
rmcp = { version = "3.1.4", default-features = false, features = ["macros", "server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
similar = "2.7"
serde-saphyr = { version = "1.1", default-features = false, features = ["deserialize"] }
toml = "1.1.4"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
toml_edit = "0.25.13"
walkdir = "2"
ureq = { version = "3.4", features = ["json"] }

[profile.dev]
debug = "limited"
